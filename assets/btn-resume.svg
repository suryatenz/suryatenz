<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-labelledby="t">
  <title id="t">Résumé</title>
  <style>
    @font-face { font-family:'display-m'; font-weight:500; font-style:normal; src:url(data:font/woff2;base64,) format('woff2'); }
    .f-display-m { font-family:'display-m', ui-sans-serif, system-ui, sans-serif; }
    
    .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .r1 { animation-delay:.05s } .r2 { animation-delay:.2s } .r3 { animation-delay:.35s } .r4 { animation-delay:.5s } .r5 { animation-delay:.65s }
    .draw { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .3s forwards; }
    .grow { transform-box:fill-box; transform-origin:left; transform:scaleX(0); animation: grow 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    .growy { transform-box:fill-box; transform-origin:bottom; transform:scaleY(0); animation: growy .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .drift1 { animation: d1 18s ease-in-out infinite alternate; }
    .drift2 { animation: d2 22s ease-in-out infinite alternate; }
    .drift3 { animation: d3 20s ease-in-out infinite alternate; }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes grow { to { transform:scaleX(1); } }
    @keyframes growy { to { transform:scaleY(1); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
    @keyframes d1 { to { transform:translate(-60px, 40px); } }
    @keyframes d2 { to { transform:translate(50px, -30px); } }
    @keyframes d3 { to { transform:translate(-40px, -40px); } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation:none; opacity:1; } .draw { animation:none; stroke-dashoffset:0; }
      .grow, .growy { animation:none; transform:none; } .pulse, .drift1, .drift2, .drift3 { animation:none; }
    }
    
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#585e6c"/></marker>
    
  </defs>
<rect x="1" y="1" width="278" height="62" rx="31.0" fill="#ff8a5c"/><text x="140" y="40" class="f-display-m" font-size="21" fill="#15171f" text-anchor="middle" >Résumé ↓</text>
</svg>
