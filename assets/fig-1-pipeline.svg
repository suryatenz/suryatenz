<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
  <title id="t">Figure 1. Job Alerts pipeline: five posting sources feed rule filters for experience, sponsorship and degree, then LLM fit ranking with the Claude API, drafted answers with a learning memory profile, and human review. Playwright pre-fills forms but never submits.</title>
  <style>
    .paper { fill:#f6f1e7; }
    .edge { fill:none; stroke:#e2d9c6; stroke-width:1; }
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; }
    .ink { fill:#1c1b19; } .mut { fill:#6e675b; } .acc { fill:#8f2d22; } .nav { fill:#2d4a73; }
    .sk { stroke:#1c1b19; stroke-width:1.2; fill:none; }
    .skm { stroke:#b9ae98; stroke-width:1; fill:none; }
    .grid { stroke:#e4dccb; stroke-width:1; }
    .caps { font-size:12px; letter-spacing:2.5px; }
    .fade { opacity:0; animation: in 1s ease-out forwards; }
    .d1 { animation-delay:.15s } .d2 { animation-delay:.4s } .d3 { animation-delay:.65s }
    .ink-draw { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 2.4s cubic-bezier(.6,0,.2,1) .3s forwards; }
    @keyframes in { to { opacity:1; } }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation:none; opacity:1; } .ink-draw { animation:none; stroke-dashoffset:0; } }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1b19"/>
    </marker>
  </defs>
  <rect class="paper" width="1200" height="420" rx="6"/>
  <rect class="edge" x=".5" y=".5" width="1199" height="419" rx="6"/>
<text x="40" y="40" class="serif mut" font-size="15" text-anchor="start" font-style="italic">(a) Daily pipeline</text>
<rect x="40" y="70" width="170" height="42" rx="4" fill="#fbf8f1" stroke="#1c1b19" stroke-width="1.2"/><text x="125.0" y="96.2" class="serif ink" font-size="15" text-anchor="middle" font-style="normal">SimplifyJobs</text>
<path class="sk" d="M210 91 C 250 91, 250 211, 290 211" marker-end="url(#ar)"/>
