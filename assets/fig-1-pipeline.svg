<path class="sk" d="M210 149 C 250 149, 250 211, 290 211" marker-end="url(#ar)"/>
<rect x="40" y="186" width="170" height="42" rx="4" fill="#fbf8f1" stroke="#1c1b19" stroke-width="1.2"/><text x="125.0" y="212.2" class="serif ink" font-size="15" text-anchor="middle" font-style="normal">Lever</text>
