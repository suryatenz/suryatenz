<text x="125" y="390" class="serif mut" font-size="14" text-anchor="middle" font-style="italic">n ≈ 10,000+ postings / day</text>
<rect x="300" y="156" width="180" height="110" rx="4" fill="#fbf8f1" stroke="#1c1b19" stroke-width="1.2"/><text x="390.0" y="205.4" class="serif ink" font-size="17" text-anchor="middle" font-style="normal">Rule filters</text><text x="390.0" y="225.1" class="serif mut" font-size="13" text-anchor="middle" font-style="italic">experience · sponsorship · degree</text>
<path class="sk" d="M480 211 H526" marker-end="url(#ar)"/>
<rect x="530" y="156" width="180" height="110" rx="4" fill="#efe6d4" stroke="#8f2d22" stroke-width="1.2"/><text x="620.0" y="205.4" class="serif ink" font-size="17" text-anchor="middle" font-style="normal">Fit ranking</text><text x="620.0" y="225.1" class="serif mut" font-size="13" text-anchor="middle" font-style="italic">LLM · Claude API</text>
