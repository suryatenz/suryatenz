<path class="sk" d="M940 211 H986" marker-end="url(#ar)"/>
<rect x="990" y="156" width="180" height="110" rx="4" fill="#fbf8f1" stroke="#1c1b19" stroke-width="1.2"/><text x="1080.0" y="182.4" class="serif ink" font-size="17" text-anchor="middle" font-style="normal">Human review</text><text x="1080.0" y="206.1" class="serif mut" font-size="13" text-anchor="middle" font-style="italic">Flask dashboard</text><text x="1080.0" y="225.1" class="serif mut" font-size="13" text-anchor="middle" font-style="italic">Playwright pre-fill,</text><text x="1080.0" y="244.1" class="serif acc" font-size="13" text-anchor="middle" font-style="italic">never submits</text>
<path class="sk" d="M1080 266 V320 H850 V272" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="965" y="342" class="serif mut" font-size="13" text-anchor="middle" font-style="italic">corrections feed the memory profile</text>
